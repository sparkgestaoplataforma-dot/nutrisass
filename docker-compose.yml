services:
  postgres:
    image: postgres:16-alpine
    container_name: nutricao-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nutricao
      POSTGRES_PASSWORD: nutricao
      POSTGRES_DB: nutricao
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nutricao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
