version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrisaas-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: kevin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nutrisaas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
