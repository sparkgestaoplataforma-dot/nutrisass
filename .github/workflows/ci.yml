name: CI — Qualidade, Testes e Build

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "hotfix/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Unit Tests & Production Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nutrisass_test?schema=public"
      JWT_SECRET: "ci-test-jwt-secret-key-min-32-chars-123456"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      REDIS_URL: "redis://localhost:6379"
      PORT: "3333"

    steps:
      - name: Enforce GitFlow Branch Policy (PRs to main only from develop or hotfix/*)
        if: github.event_name == 'pull_request'
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          HEAD_BRANCH="${{ github.head_ref }}"
          echo "Validando GitFlow: ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          if [ "$BASE_BRANCH" = "main" ]; then
            if [ "$HEAD_BRANCH" != "develop" ] && [[ ! "$HEAD_BRANCH" =~ ^hotfix/ ]]; then
              echo "::error::Violação de GitFlow: Pull Requests para a branch 'main' só são permitidos a partir da branch 'develop' ou de uma branch 'hotfix/*'. Altere a branch base deste PR para 'develop'."
              exit 1
            fi
          fi
          echo "GitFlow válido!"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@nutricao/api

      - name: Build Shared Package (@nutricao/shared)
        run: npm run build --workspace=@nutricao/shared

      - name: TypeScript Lint (shared, api, web)
        run: npm run lint

      - name: Run Unit Tests (API & Web)
        run: npm test

      - name: Build Production Bundles
        run: npm run build
